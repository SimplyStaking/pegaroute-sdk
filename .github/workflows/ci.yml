# Checks every pull request and every push to main. Never publishes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Same Bun version as local development (`packageManager` in package.json).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      # Builds like a publish would (check:package has a prepack command that calls `bun run build`), then publint and are-the-types-wrong: the package's exports and types
      # resolve for ESM consumers and bundlers.
      - name: Build and check package
        run: bun run check:package

      # The examples compile against the built SDK, through its published entry points.
      - name: Typecheck examples
        run: bun run typecheck:examples

      # The lowest Node we support (`.node-version`), for the smoke test of the built package on real Node.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Node smoke test
        run: bun run test:node
